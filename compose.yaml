services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadvision}
      POSTGRES_USER: ${POSTGRES_USER:-roadvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlanmalı}
      # Web paneli rolü; boşsa initdb web temelini atlar (sonradan
      # web/scripts/bootstrap_db.sh ile kurulabilir).
      ROADVISION_WEB_PASSWORD: ${ROADVISION_WEB_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - roadvision_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-roadvision-schema.sql:ro
      - ./db/roadvision_schema_v1_2_1.sql:/docker-entrypoint-initdb.d/002-roadvision-schema-v3.sql:ro
      - ./web/db/001-webapp-bootstrap.sh:/docker-entrypoint-initdb.d/003-webapp-bootstrap.sh:ro
      - ./web/db/bootstrap.sql:/web-db/bootstrap.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  # RoadVision Web API (Faz 0 iskeleti; bkz. WEB_PLANI.md).
  # Yalnız salt-okunur roadvision_web rolünü bilir; masaüstünün sahip
  # DSN'i bu servise verilmez.
  api:
    build: ./web
    restart: unless-stopped
    environment:
      ROADVISION_WEB_DSN: postgresql://roadvision_web:${ROADVISION_WEB_PASSWORD:?ROADVISION_WEB_PASSWORD .env içinde tanımlanmalı}@postgres:5432/${POSTGRES_DB:-roadvision}
    ports:
      - "127.0.0.1:${ROADVISION_WEB_PORT:-8800}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  roadvision_postgres_data:
