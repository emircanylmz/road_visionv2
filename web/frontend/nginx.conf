# RoadVision Web Paneli — nginx (WEB_PLANI.md §3, Faz 2)
# Statik SPA'yı sunar, /api ve /healthz isteklerini compose ağındaki
# api servisine geçirir. Güvenlik başlıkları server düzeyinde tutulur;
# location bloklarında add_header kullanılmaz (nginx'te location içindeki
# add_header, server düzeyindekileri devre dışı bırakır).

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    # Vite üretim varlıkları içerik-özetli adlandırılır; süresiz önbellek.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA yönlendirmesi: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri /index.html;
    }
}

# TLS örneği (üretim; sertifika yolları kuruluma özgüdür — bkz. §8):
